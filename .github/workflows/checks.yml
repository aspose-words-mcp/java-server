name: Deployment checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and catalog
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
          python -m json.tool config/product-platform-plugins.json > /dev/null
  registration:
    needs: configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./scripts/setup.sh
      - name: Plugin regression suite
        working-directory: plugins/words-java
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m unittest discover -s tests -v
